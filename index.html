<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Slide Conducteur 3D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0b0f19;
            font-family: Arial, sans-serif;
        }
        #info {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: #38bdf8;
            font-weight: bold;
            pointer-events: none;
            font-size: 16px;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="info">Cliquez sur la carte 3D pour basculer Recto / Verso</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const pointLight = new THREE.PointLight(0xffffff, 1.5);
        pointLight.position.set(5, 5, 5);
        scene.add(pointLight);

        function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
            text.split('\n').forEach(paragraph => {
                const words = paragraph.split(' ');
                let line = '';
                for (let n = 0; n < words.length; n++) {
                    const testLine = line + words[n] + ' ';
                    if (ctx.measureText(testLine).width > maxWidth && n > 0) {
                        ctx.fillText(line, x, y);
                        line = words[n] + ' ';
                        y += lineHeight;
                    } else {
                        line = testLine;
                    }
                }
                ctx.fillText(line, x, y);
                y += lineHeight;
            });
        }

        function createCardTexture(title, text, isBack = false) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 768;
            const ctx = canvas.getContext('2d');

            // Le verso est vu "de dos" : on le dessine en miroir pour qu'il soit lisible
            if (isBack) {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            }

            ctx.fillStyle = isBack ? '#1e293b' : '#0f172a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 16;
            ctx.strokeRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#38bdf8';
            ctx.font = 'bold 36px Arial';
            ctx.fillText(isBack ? "01 / 30 — SOURCES & RÉFÉRENCES" : "01 / 30 — EXOSQUELETTES / REINHO", 60, 90);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 46px Arial';
            ctx.fillText(title, 60, 180);

            ctx.fillStyle = '#94a3b8';
            ctx.font = '30px Arial';
            wrapText(ctx, text, 60, 270, 900, 45);

            return new THREE.CanvasTexture(canvas);
        }

        const rectoText = "L'exosquelette réel commence par un geste ordinaire. Le mot exosquelette recouvre plusieurs machines : certaines ajoutent de la puissance avec des moteurs, d'autres redistribuent les efforts.";
        const versoText = "Sources bibliographiques :\n1. Popular Science - Les exosquelettes militaires\n2. Military Trade - Analyse des déploiements\n3. Myo Institute - Rapports de recherche biomécanique";

        const textureRecto = createCardTexture("L'exosquelette et le terrain", rectoText, false);
        const textureVerso = createCardTexture("Références & Données", versoText, true);

        const geometry = new THREE.PlaneGeometry(4.5, 3.4);
        const material = new THREE.MeshStandardMaterial({
            map: textureRecto,
            roughness: 0.3,
            metalness: 0.1,
            side: THREE.DoubleSide
        });

        const card = new THREE.Mesh(geometry, material);
        scene.add(card);

        camera.position.z = 6;

        let targetRotationY = 0;
        let currentlyBack = false;

        window.addEventListener('click', () => {
            targetRotationY += Math.PI;
        });

        function animate() {
            requestAnimationFrame(animate);
            card.rotation.y += (targetRotationY - card.rotation.y) * 0.1;

            // La texture change selon la face réellement visible, sans minuterie
            const facingBack = Math.cos(card.rotation.y) < 0;
            if (facingBack !== currentlyBack) {
                currentlyBack = facingBack;
                card.material.map = facingBack ? textureVerso : textureRecto;
                card.material.needsUpdate = true;
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
